# Reverse proxy for production: routes /v1 to the backend container,
# everything else to the built frontend static files.
server {
  listen 80;

  location /v1/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
