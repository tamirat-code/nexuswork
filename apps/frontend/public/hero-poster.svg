<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Abstract teal light trails representing connected student work">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03151f"/>
      <stop offset="0.55" stop-color="#063446"/>
      <stop offset="1" stop-color="#0a1723"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="42%" r="60%">
      <stop offset="0" stop-color="#1dd8c3" stop-opacity=".45"/>
      <stop offset=".42" stop-color="#087f9c" stop-opacity=".16"/>
      <stop offset="1" stop-color="#03151f" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round" filter="url(#blur)" opacity=".7">
    <path d="M-80 850 C360 520 590 1040 1050 670 S1680 250 2040 430" stroke="#14cdb9" stroke-width="28"/>
    <path d="M-120 1000 C390 650 700 900 1080 510 S1660 120 2040 240" stroke="#237fa7" stroke-width="18"/>
    <path d="M260 1090 C640 770 900 930 1270 590 S1660 410 2010 520" stroke="#8be7d9" stroke-width="9"/>
  </g>
  <g fill="#8be7d9" opacity=".55">
    <circle cx="1090" cy="650" r="7"/><circle cx="1430" cy="420" r="5"/><circle cx="1640" cy="330" r="8"/><circle cx="780" cy="800" r="5"/>
  </g>
</svg>
