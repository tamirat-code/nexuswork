services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./apps/backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./apps/backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/nexuswork
    depends_on:
      - mongo

  frontend:
    build: ./apps/frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
