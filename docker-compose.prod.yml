services:
  backend:
    build: ./apps/backend
    restart: always
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: production
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_API_BASE_URL: /v1
        VITE_SOCKET_URL: ""
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy